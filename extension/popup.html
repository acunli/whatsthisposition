<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>what’sthisposition</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      body {
        width: 320px;
      }
      .found {
        margin: 0;
        font-weight: 650;
      }
      .found span {
        display: block;
        color: var(--bone-2);
        font-weight: 500;
        font-size: 13px;
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <header class="head"><img src="icons/32.png" width="26" height="26" alt="" /><span class="word">what’sthis<b>position</b></span></header>
      <p class="status" id="status" aria-live="polite">Looking for a game on this page…</p>
      <button class="primary" id="review" type="button" disabled>Review this game</button>
      <p class="note">Opens a review card in the corner of the page. Finished games only; Stockfish 19 runs on your computer and nothing is uploaded.</p>
      <a class="secondary" id="site" href="https://www.whatsthisposition.com" target="_blank" rel="noopener">Open what’sthisposition</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
