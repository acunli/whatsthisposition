<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>what’sthisposition</title>
    <link rel="stylesheet" href="panel.css" />
    <style>
      body {
        width: 320px;
      }
      .found {
        margin: 0;
        font-weight: 650;
      }
      .found span {
        display: block;
        color: var(--bone-2);
        font-weight: 500;
        font-size: 13px;
      }
      .primary:disabled {
        opacity: 0.45;
        cursor: default;
        filter: none;
      }
      .sites {
        display: grid;
        gap: 8px;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .sites legend {
        margin-bottom: 8px;
        padding: 0;
        color: var(--bone-2);
        font-size: 13px;
      }
      .site {
        display: flex;
        gap: 9px;
        align-items: flex-start;
        font-size: 13px;
        cursor: pointer;
      }
      .site input {
        margin: 2px 0 0;
        accent-color: var(--brand);
      }
      .site small,
      .watch {
        display: block;
        color: var(--dim);
        font-size: 12px;
      }
      .site input:checked ~ span small,
      .watch:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <main id="app">
      <header class="head"><img src="icons/32.png" width="26" height="26" alt="" /><span class="word">what’sthis<b>position</b></span></header>
      <p class="status" id="status" aria-live="polite">Looking for a game on this page…</p>
      <button class="primary" id="review" type="button" disabled>Review this game</button>
      <p class="note">Opens a review card in the corner of the page. Finished games only; Stockfish 19 runs on your computer and nothing is uploaded.</p>
      <fieldset class="sites">
        <legend>Open the card by itself when a game ends on</legend>
        <label class="site"><input type="checkbox" id="chesscom" checked /><span>Chess.com</span></label>
        <label class="site"><input type="checkbox" id="lichess" /><span>Lichess<small>Your browser asks first, to let the extension see lichess.org.</small></span></label>
        <small class="watch" id="watch"></small>
      </fieldset>
      <a class="secondary" id="site" href="https://www.whatsthisposition.com" target="_blank" rel="noopener">Open what’sthisposition</a>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
